name: Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and upload macOS binary
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build release binary
        run: swift build -c release --product seldon

      - name: Package binary
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          NAME="seldon-macos-${ARCH}"
          mkdir -p dist
          cp .build/release/seldon "dist/${NAME}"
          chmod +x "dist/${NAME}"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          echo "asset=dist/${NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset }}
